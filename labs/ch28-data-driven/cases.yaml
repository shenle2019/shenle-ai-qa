cases:
  - id: login-correct
    title: 正确账号密码能登录成功
    action: login_ok
    expect: "登录成功"
  - id: login-wrong
    title: 错误密码被服务端拒绝
    action: login_bad
    expect: "用户名或密码错误"
  - id: load-photo
    title: 网络图片能下载并渲染
    action: photo
    expect: "ImageView"
  - id: title-visible
    title: 首屏标题可见
    action: title
    expect: "登录联调 Demo"
