[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shenle-api-record"
version = "0.1.0"
description = "华测接口录制工具 - 通过 mitmproxy 系统代理录制浏览器/APP/手机H5/桌面应用的 HTTP/HTTPS 流量"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "mitmproxy>=9.0",
]

[project.scripts]
shenle-api-record = "shenle_api_record.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]