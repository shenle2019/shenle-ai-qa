[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shenle-device-record"
version = "0.1.0"
description = "设备端界面采集 CLI：截图 + 界面结构 → JSON"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Shenle" }]
dependencies = [
    "websockets>=12.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
shenle-device-record = "shenle_device_record.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shenle_device_record = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"